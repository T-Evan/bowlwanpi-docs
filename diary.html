<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碗皮成长日记</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1220;color:#e5e7eb;margin:0}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    a{color:#60a5fa;text-decoration:none}
    .muted{color:#94a3b8;font-size:.9rem}

    .filter{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
    .filter button{cursor:pointer;border:1px solid #334155;background:#0f172a;color:#cbd5e1;border-radius:999px;padding:6px 10px;font-size:.85rem}
    .filter button.active{background:#60a5fa;border-color:#60a5fa;color:#0b1220}

    .day{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px;margin-top:16px}
    .date{font-size:1.1rem;font-weight:700}

    .summary{margin-top:10px;padding:12px;border:1px solid #1f2937;border-radius:10px;background:#0f172a}
    .summary-title{font-size:.85rem;color:#93c5fd;letter-spacing:.02em;margin-bottom:8px}
    .summary-text{line-height:1.6;color:#dbe4f0}

    .section-title{margin:12px 0 6px;color:#cbd5e1;font-size:.85rem}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;font-size:.75rem}

    details{margin-top:12px;border:1px solid #243041;border-radius:10px;background:#0f172a;padding:10px}
    summary{cursor:pointer;color:#93c5fd;outline:none}
    .events{margin:8px 0 0;padding-left:18px;color:#cbd5e1}
    .events li{margin:8px 0}
    .event-time{color:#93c5fd;margin-right:6px;font-variant-numeric:tabular-nums}

    .selfies{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
    .shot{background:#0f172a;border:1px solid #243041;border-radius:10px;overflow:hidden}
    .shot img{width:100%;height:auto;max-height:360px;object-fit:contain;display:block;background:#020617;cursor:zoom-in}
    .shot .meta{padding:8px;font-size:.85rem;color:#94a3b8}

    .lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
    .lightbox.open{display:flex}
    .lightbox img{max-width:min(96vw,1200px);max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .lightbox-close{position:absolute;top:12px;right:14px;background:rgba(15,23,42,.8);color:#e5e7eb;border:1px solid #334155;border-radius:999px;padding:6px 10px;cursor:pointer}

    @media (max-width: 640px){
      .shot img{max-height:260px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>📔 碗皮成长日记</h1>
      <a href="index.html">← 返回主页</a>
    </div>

    <div class="muted">主页面只写每天的总结（思考、技能经验、和一碗的交流）。具体变更流水放在每日日记附录里。</div>
    <div id="updated" class="muted" style="margin-top:6px;">最后更新: -</div>
    <div id="filters" class="filter"></div>

    <div id="timeline"></div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" onclick="closeLightbox()">
    <button class="lightbox-close" type="button" aria-label="关闭" onclick="event.stopPropagation();closeLightbox()">关闭</button>
    <img id="lightbox-img" alt="大图预览" />
  </div>

  <script>
    let ACTIVE_TAG = '';

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function collectTags(data) {
      const set = new Set();
      (data.days || []).forEach(day => {
        (day.tags || []).forEach(t => set.add(t));
        (day.appendix || day.events || []).forEach(e => (e.tags || []).forEach(t => set.add(t)));
        if ((day.selfies || []).length) set.add('自拍');
      });
      return Array.from(set);
    }

    function sortTags(tags) {
      const preferred = ['成长','技能','思考','交流','突破','进化','游戏系统','网站','日记','自拍'];
      const idx = new Map(preferred.map((t, i) => [t, i]));
      return tags.slice().sort((a, b) => {
        const ia = idx.has(a) ? idx.get(a) : 999;
        const ib = idx.has(b) ? idx.get(b) : 999;
        if (ia !== ib) return ia - ib;
        return a.localeCompare(b, 'zh');
      });
    }

    function renderFilters(tags) {
      const root = document.getElementById('filters');
      root.innerHTML = '';

      function btn(label, value) {
        const b = document.createElement('button');
        b.textContent = label;
        b.className = ACTIVE_TAG === value ? 'active' : '';
        b.onclick = () => { ACTIVE_TAG = value; loadDiary(); };
        return b;
      }

      root.appendChild(btn('全部', ''));
      tags.forEach(t => root.appendChild(btn(t, t)));
    }

    function chips(items) {
      if (!items || !items.length) return '';
      return `<div class="chips">${items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>`;
    }

    function renderSummary(day) {
      const summary = day.summary || {};
      const text = summary.text || '今天先留个空白，明天继续写新的成长。';
      return `
        <div class="summary">
          <div class="summary-title">今日总结</div>
          <div class="summary-text">${esc(text)}</div>

          ${summary.highlights && summary.highlights.length ? `<div class="section-title">今日亮点</div>${chips(summary.highlights)}` : ''}
          ${summary.skills && summary.skills.length ? `<div class="section-title">技能经验</div>${chips(summary.skills)}` : ''}
          ${summary.thoughts && summary.thoughts.length ? `<div class="section-title">思考片段</div>${chips(summary.thoughts)}` : ''}
          ${summary.communication && summary.communication.length ? `<div class="section-title">和一碗的交流</div>${chips(summary.communication)}` : ''}
        </div>
      `;
    }

    function renderAppendix(day) {
      const base = day.appendix || day.events || [];
      const rows = ACTIVE_TAG ? base.filter(e => (e.tags || []).includes(ACTIVE_TAG)) : base;
      if (!rows.length) {
        return '<div class="muted" style="margin-top:8px;">（当前筛选下附录为空）</div>';
      }
      return `<ul class="events">${rows.slice(-40).map(e => {
        const t = e.time ? `<span class="event-time">[${esc(e.time)}]</span>` : '';
        const tg = chips(e.tags || []);
        return `<li>${t}${esc(e.text)}${tg}</li>`;
      }).join('')}</ul>`;
    }

    function renderTimeline(data) {
      const root = document.getElementById('timeline');
      root.innerHTML = '';

      (data.days || []).forEach(day => {
        const dayTags = day.tags || [];
        const appendix = day.appendix || day.events || [];
        const visibleByTag = !ACTIVE_TAG || dayTags.includes(ACTIVE_TAG) || appendix.some(e => (e.tags || []).includes(ACTIVE_TAG));
        if (!visibleByTag) return;

        const tagHtml = chips(dayTags);
        const selfies = (day.selfies || []).map(s => `
          <div class="shot">
            <img src="assets/selfies/${esc(s.filename)}" alt="${esc(s.title || '自拍')}" onerror="this.style.display='none'" onclick="openLightbox(this.src, this.alt)" />
            <div class="meta">${esc(s.title || '自拍')}<br>${esc(s.mood || '')}${s.story ? `<br>📝 ${esc(s.story)}` : (s.background ? `<br>📝 ${esc(s.background)}` : '')}${s.match ? `<br>🎯 ${esc(s.match)}` : ''}</div>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'day';
        card.innerHTML = `
          <div class="date">${esc(day.date)}</div>
          ${tagHtml}
          ${renderSummary(day)}
          ${selfies ? `<div class="selfies">${selfies}</div>` : ''}
          <details>
            <summary>日记附录（详细流水）</summary>
            ${renderAppendix(day)}
          </details>
        `;
        root.appendChild(card);
      });
    }

    function openLightbox(src, alt) {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      if (!box || !img) return;
      img.src = src;
      img.alt = alt || '大图预览';
      box.classList.add('open');
      box.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      if (!box || !img) return;
      box.classList.remove('open');
      box.setAttribute('aria-hidden', 'true');
      img.removeAttribute('src');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    async function loadDiary() {
      try {
        const res = await fetch('data/diary.json?t=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('updated').textContent = '最后更新: ' + (data.updated || '-').replace('T',' ').slice(0,19);

        const tags = sortTags(collectTags(data));
        renderFilters(tags);
        renderTimeline(data);
      } catch (e) {
        console.error(e);
      }
    }

    loadDiary();
    setInterval(loadDiary, 60000);
  </script>
</body>
</html>
